<svg width="680" height="470" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ClaimOps architecture</title>
<desc>Browser sends requests to the API layer, which normalizes four intake channels into one pipeline of fraud scoring, coverage retrieval, rules engine, and smart assignment, all reading and writing a shared SQLite database.</desc>
<rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8A8A85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="340" y1="84" x2="340" y2="140" stroke="#8A8A85" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="196" x2="115" y2="240" stroke="#8A8A85" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="196" x2="265" y2="240" stroke="#8A8A85" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="196" x2="415" y2="240" stroke="#8A8A85" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="196" x2="565" y2="240" stroke="#8A8A85" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="115" y1="296" x2="340" y2="360" stroke="#8A8A85" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="265" y1="296" x2="340" y2="360" stroke="#8A8A85" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="415" y1="296" x2="340" y2="360" stroke="#8A8A85" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="565" y1="296" x2="340" y2="360" stroke="#8A8A85" stroke-width="1" marker-end="url(#arrow)"/>

<g>
<rect x="240" y="40" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Browser (Next.js)</text>
</g>

<g>
<rect x="210" y="140" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#0C447C">API layer</text>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#185FA5">4 intake channels, one pipeline</text>
</g>

<g>
<rect x="48" y="240" width="135" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="115" y="258" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Fraud model</text>
<text x="115" y="278" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">XGBoost scoring</text>
</g>

<g>
<rect x="198" y="240" width="135" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="265" y="258" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Coverage</text>
<text x="265" y="278" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">TF-IDF search</text>
</g>

<g>
<rect x="348" y="240" width="135" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="415" y="258" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Rules engine</text>
<text x="415" y="278" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Tenant rules</text>
</g>

<g>
<rect x="498" y="240" width="135" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="565" y="258" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">Assignment</text>
<text x="565" y="278" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">By skill, load</text>
</g>

<g>
<rect x="190" y="360" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">SQLite database</text>
<text x="340" y="398" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">claims, events, rules, adjusters</text>
</g>

<text x="340" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Every claim writes its own audit trail as it passes through the pipeline</text>
</svg>
